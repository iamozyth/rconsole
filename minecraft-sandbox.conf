# Sandbox for a Minecraft server rconsole attaches to (MC_SERVICE), offered
# by install.sh as a drop-in (<service>.d/60-rconsole-sandbox.conf). The
# same limits rconsole-mc@ servers get: only the server folder is writable;
# the backups and the servers rconsole installed are hidden, so a plugin
# can't read their worlds or RCON passwords. Remove the file to undo.
[Service]
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/srv/minecraft
InaccessiblePaths=-/srv/minecraft-backups -/srv/minecraft-servers
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
PrivateIPC=true
ProtectProc=invisible
CapabilityBoundingSet=
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
