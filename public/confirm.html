<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>Confirm address · rconsole</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/confirm.js" defer></script>
</head>
<body class="login-page" data-area="console">
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="pg-mark" viewBox="0 0 32 32">
    <rect class="mark-bg" width="32" height="32" rx="7"/>
    <path d="M16 6 25 11 16 16 7 11Z" fill="#fff"/>
    <path d="M7 12.6 15.2 17.2V26.6L7 22Z" fill="#fff" fill-opacity=".72"/>
    <path d="M25 12.6 16.8 17.2V26.6L25 22Z" fill="#fff" fill-opacity=".45"/>
  </symbol>
  <symbol id="pg-check" viewBox="0 0 24 24"><path d="M9.4 15.6 19.2 5.8l1.8 1.8L9.4 19.2 3 12.8l1.8-1.8z"/></symbol>
  <symbol id="pg-alert" viewBox="0 0 24 24"><path d="M12 2.5 22.5 21h-21zm-1.2 6.2v6.1h2.4V8.7zm0 7.6v2.4h2.4v-2.4z" fill-rule="evenodd"/></symbol>
</svg>
<main class="login">
  <div class="login-brand">
    <svg class="mark" aria-hidden="true"><use href="#pg-mark"/></svg>
    <span class="login-host" id="host"></span>
  </div>
  <section class="panel login-card">
    <form id="confirm" novalidate>
      <div class="login-head">
        <h1 id="title">Keep this address?</h1>
        <p class="lede" id="lede">You reached rconsole at its new address. Confirm to keep it; otherwise rconsole goes back to the old one in a few minutes.</p>
      </div>
      <p class="login-error" id="error" role="alert" hidden><svg><use href="#pg-alert"/></svg><span id="error-text"></span></p>
      <button class="btn btn-primary login-submit" id="submit"><span class="spinner" aria-hidden="true"></span><svg class="done" aria-hidden="true"><use href="#pg-check"/></svg><span id="submit-text">Keep this address</span></button>
      <a class="btn btn-quiet btn-sm login-back" id="open" href="/" hidden>Open rconsole</a>
    </form>
  </section>
</main>
</body>
</html>
