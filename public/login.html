<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>Sign in · rconsole</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script src="/login.js" defer></script>
</head>
<body class="login-page" data-area="console">
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="pg-mark" viewBox="0 0 32 32">
    <rect class="mark-bg" width="32" height="32" rx="7"/>
    <path d="M16 6 25 11 16 16 7 11Z" fill="#fff"/>
    <path d="M7 12.6 15.2 17.2V26.6L7 22Z" fill="#fff" fill-opacity=".72"/>
    <path d="M25 12.6 16.8 17.2V26.6L25 22Z" fill="#fff" fill-opacity=".45"/>
  </symbol>
  <symbol id="pg-eye" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 5c4.6 0 8.4 2.9 10 7-1.6 4.1-5.4 7-10 7s-8.4-2.9-10-7c1.6-4.1 5.4-7 10-7zm0 2.4A4.6 4.6 0 1 0 12 16.6 4.6 4.6 0 0 0 12 7.4zm0 2.3a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6z"/></symbol>
  <symbol id="pg-eye-off" viewBox="0 0 24 24"><path d="M4.1 2.4 21.6 19.9l-1.7 1.7-3.2-3.2A10.6 10.6 0 0 1 12 19.4c-4.6 0-8.4-2.9-10-7a11.5 11.5 0 0 1 3.6-4.8L2.4 4.1zm3.2 6.9A9 9 0 0 0 4.6 12.4c1.4 2.9 4.2 4.6 7.4 4.6 1.2 0 2.3-.2 3.3-.7l-1.6-1.6a3.9 3.9 0 0 1-5-5zM12 5.4c4.6 0 8.4 2.9 10 7a11.4 11.4 0 0 1-2.7 4l-1.7-1.7a9 9 0 0 0 1.8-2.3C18 9.5 15.2 7.8 12 7.8c-.6 0-1.2 0-1.7.2L8.4 6.1C9.5 5.6 10.7 5.4 12 5.4z"/></symbol>
  <symbol id="pg-back" viewBox="0 0 24 24"><path d="M10.6 4.6 12.3 6.3 7.8 10.8H21v2.4H7.8l4.5 4.5-1.7 1.7L3.2 12z"/></symbol>
  <symbol id="pg-shield" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2 20.5 5v6.4c0 5-3.6 9.2-8.5 10.6-4.9-1.4-8.5-5.6-8.5-10.6V5zm3.9 6.6-5.3 5.3-2.5-2.5-1.6 1.6 4.1 4.1 6.9-6.9z"/></symbol>
  <symbol id="pg-check" viewBox="0 0 24 24"><path d="M9.4 15.6 19.2 5.8l1.8 1.8L9.4 19.2 3 12.8l1.8-1.8z"/></symbol>
  <symbol id="pg-key" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M15.5 2.5a6 6 0 1 1-1.9 11.7l-1.4 1.4H10v2.2H7.8v2.2H5.6L4 21.6H2.5V18l7.3-7.3A6 6 0 0 1 15.5 2.5zm1.6 3.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z"/></symbol>
  <symbol id="pg-alert" viewBox="0 0 24 24"><path d="M12 2.5 22.5 21h-21zm-1.2 6.2v6.1h2.4V8.7zm0 7.6v2.4h2.4v-2.4z" fill-rule="evenodd"/></symbol>
</svg>
<main class="login">
  <div class="login-brand">
    <svg class="mark" aria-hidden="true"><use href="#pg-mark"/></svg>
    <span class="login-host" id="host"></span>
  </div>
  <section class="panel login-card">
    <form id="login" autocomplete="on" novalidate>
      <div class="login-head">
        <span class="login-badge" id="badge" hidden><svg><use href="#pg-shield"/></svg></span>
        <h1 id="title">Sign in to rconsole</h1>
        <p class="lede" id="lede">Run your Minecraft server from anywhere.</p>
      </div>

      <div class="sso" id="sso" hidden>
        <a class="btn btn-primary login-submit sso-btn" id="sso-btn" href="/auth/oidc/start"><span class="spinner" aria-hidden="true"></span><svg class="key" aria-hidden="true"><use href="#pg-key"/></svg><span id="sso-text">Continue with SSO</span></a>
        <button class="login-or" type="button" id="local-toggle" aria-expanded="false" aria-controls="step-password" hidden><span>or use a local account</span></button>
      </div>

      <div class="login-step" id="step-password">
        <label class="fld"><span>Username</span>
          <input class="field" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
        </label>
        <label class="fld"><span>Password</span>
          <span class="pw-wrap">
            <input class="field" name="password" type="password" autocomplete="current-password" required>
            <button class="pw-toggle" type="button" id="pw-toggle" aria-label="Show password" aria-pressed="false"><svg><use href="#pg-eye"/></svg></button>
          </span>
          <span class="caps" id="caps" hidden>Caps Lock is on</span>
        </label>
      </div>

      <div class="login-step" id="step-code" hidden>
        <label class="fld"><span class="sr">Authenticator code</span>
          <input class="field code-field" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="000 000" aria-describedby="lede">
        </label>
      </div>

      <p class="login-error" id="error" role="alert" hidden><svg><use href="#pg-alert"/></svg><span id="error-text"></span></p>

      <button class="btn btn-primary login-submit" id="submit"><span class="spinner" aria-hidden="true"></span><svg class="done" aria-hidden="true"><use href="#pg-check"/></svg><span id="submit-text">Continue</span></button>
      <button class="btn btn-quiet btn-sm login-back" type="button" id="back" hidden><svg><use href="#pg-back"/></svg>Use another account</button>
    </form>
  </section>
  <p class="foot"><span id="foot-text">Accounts are managed on the server with <code>cli.js</code>.</span> <span class="preview-tag">Early preview</span></p>
</main>
</body>
</html>
