# Publishes a GitHub release for every pushed version tag (v1.2.3), after the
# tests pass. Release notes come from docs/releases/<tag>.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "rconsole ${TAG}" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --title "rconsole ${TAG}" --generate-notes
          fi
